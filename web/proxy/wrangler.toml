# Vigilance web CORS proxy. Deploy from this folder:  npx wrangler deploy
# See web/proxy/README.md.
name = "vigilante-proxy"
main = "worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Comma-separated list of sites allowed to call the proxy (the web app's origin, not the sites embedding it).
# Example: "https://r0n1n9.github.io". Leave empty to allow any origin (the host allowlist still applies).
ALLOWED_ORIGINS = ""
# Soft per-IP limit (per Worker isolate). One open dashboard makes roughly 40-80 requests a minute.
RATE_LIMIT_PER_MIN = "300"

# Optional: a global per-IP limit with Cloudflare's rate-limiting binding (uncomment to use).
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }
