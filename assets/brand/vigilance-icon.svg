<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C2B"/>
      <stop offset="1" stop-color="#05090E"/>
    </linearGradient>
    <radialGradient id="cobalt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#1D55C9"/>
      <stop offset="1" stop-color="#0B2A70"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8BEBFF"/>
      <stop offset="1" stop-color="#2BB8E0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens"><path d="M118 512 Q512 150 906 512 Q512 874 118 512 Z"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="208" fill="none" stroke="#3DD6F5" stroke-opacity="0.22" stroke-width="6"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#3DD6F5" stroke-opacity="0.75" stroke-width="16" stroke-linecap="square">
    <path d="M150 238 V150 H238"/>
    <path d="M786 150 H874 V238"/>
    <path d="M874 786 V874 H786"/>
    <path d="M238 874 H150 V786"/>
  </g>

  <!-- segmented range ring behind the eye -->
  <g stroke="#3DD6F5" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <circle cx="512" cy="512" r="318" fill="none" stroke-dasharray="26 24" stroke-width="10"/>
  </g>

  <!-- reticle ticks -->
  <g stroke="#3DD6F5" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <path d="M512 112 V188"/>
    <path d="M512 836 V912"/>
    <path d="M58 512 H104"/>
    <path d="M920 512 H966"/>
  </g>

  <!-- eye -->
  <path d="M118 512 Q512 150 906 512 Q512 874 118 512 Z" fill="#081321"/>
  <g clip-path="url(#lens)">
    <circle cx="512" cy="512" r="236" fill="url(#cobalt)"/>
    <circle cx="512" cy="512" r="176" fill="#EAF6FC"/>
    <circle cx="512" cy="512" r="126" fill="url(#cyan)"/>
    <circle cx="512" cy="512" r="74" fill="#04070B"/>
    <circle cx="548" cy="474" r="20" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <path d="M118 512 Q512 150 906 512 Q512 874 118 512 Z" fill="none" stroke="#3DD6F5" stroke-width="22" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
