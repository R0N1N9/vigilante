# Build the web app (web/) and publish it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
# Optional: Settings -> Secrets and variables -> Actions -> Variables -> VITE_PROXY_URL
#   = your deployed web/proxy Worker URL (see web/proxy/README.md). It is a public URL, not a secret.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'packs/**', 'config/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Build
        run: npm run build:web
        env:
          # Project pages live at https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
